<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Metamorphosis loop — frame renderer</title>
<style>html,body{margin:0;background:#111}canvas{display:block;margin:0 auto;width:540px;height:540px}</style>
</head>
<body>
<canvas id="c" width="720" height="720"></canvas>
<script src="sprites/horse_cycle.js"></script>
<script>
'use strict';
const W=720,H=720,FPS=24,LOOP=356,TOTAL=712;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(f,a,b)=>clamp((f-a)/(b-a),0,1);
const E={io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, o:t=>1-Math.pow(1-t,3), i:t=>t*t*t, o5:t=>1-Math.pow(1-t,5)};
function mb32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
// value noise (seeded, smooth)
function vnoise(seed){
  const r=mb32(seed), g=new Float32Array(256); for(let i=0;i<256;i++)g[i]=r();
  return (x)=>{const xi=Math.floor(x)&255, xf=x-Math.floor(x), s=xf*xf*(3-2*xf);
    return g[xi]*(1-s)+g[(xi+1)&255]*s;};
}
const wob=vnoise(77), wob2=vnoise(133);

// palette
const BLUE=[74,106,247], GREEN=[44,104,48], SKY=[79,113,250];
const SUNCOLORS=['#d63420','#e03a22','#f5c419','#fdf40c','#f99e34','#ee5fa2'];

// ---------- assets ----------
const horse=[], horseMeta=[];let headMask=null,contImg=null,META=null;
function load(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function loadAll(){
  META=window.HORSE_META;
  for(let i=0;i<32;i++) horse.push(await load(`sprites/horse_${String(i).padStart(2,'0')}.png`));
  headMask=await load('sprites/head_mask.png');
  contImg=await load('sprites/continents.png');
}
// paper texture: low-freq blotches + fine grain
function makePaper(base,amp,seed,w=W,h=H){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d'),id=x.createImageData(w,h),r=mb32(seed);
  // blotch field: sum of a few random radial soft blobs stored coarse
  const nb=90,blobs=[];
  for(let i=0;i<nb;i++)blobs.push([r()*w,r()*h,16+r()*70,(r()-0.5)*2*amp]);
  const coarse=new Float32Array((w>>3)*(h>>3));
  for(let cy=0;cy<h>>3;cy++)for(let cx=0;cx<w>>3;cx++){
    let v=0;const px=cx*8,py=cy*8;
    for(const[bx,by,br,ba]of blobs){const d2=(px-bx)*(px-bx)+(py-by)*(py-by);if(d2<br*br)v+=ba*(1-Math.sqrt(d2)/br);}
    coarse[cy*(w>>3)+cx]=v;
  }
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){
    const v=coarse[(y>>3)*(w>>3)+(xx>>3)]+(r()-0.5)*amp*0.9;
    const p=(y*w+xx)*4;
    id.data[p]=clamp(base[0]+v,0,255);id.data[p+1]=clamp(base[1]+v,0,255);id.data[p+2]=clamp(base[2]+v,0,255);id.data[p+3]=255;
  }
  x.putImageData(id,0,0);return c;
}
const papers={blue:[],green:[],sky:[],black:[]};
let headTinted=[],horseBlack=[],contTinted=null,sparkle=[];
function prep(){
  for(let i=0;i<4;i++){
    papers.blue.push(makePaper([60,92,243],16,100+i));
    papers.sky.push(makePaper([64,98,247],14,200+i));
    papers.green.push(makePaper(GREEN,20,300+i));
    papers.black.push(makePaper([6,6,8],4,400+i));
  }
  // sparkle tiles for black scenes
  for(let i=0;i<4;i++){
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d'),r=mb32(900+i);
    x.fillStyle='#fff';
    for(let k=0;k<140;k++){const a=r();x.globalAlpha=0.04+a*0.10;x.fillRect(r()*W,r()*H,1.5+r()*2,1.5+r()*2);}
    sparkle.push(c);
  }
  // tinted head: blue paper through head alpha
  for(let i=0;i<4;i++){
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.drawImage(headMask,0,0);x.globalCompositeOperation='source-in';x.drawImage(papers.blue[i],0,0);
    headTinted.push(c);
  }
  // black horse sprites
  for(let i=0;i<32;i++){
    const im=horse[i],c=document.createElement('canvas');c.width=im.width;c.height=im.height;
    const x=c.getContext('2d');x.drawImage(im,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#060607';x.fillRect(0,0,c.width,c.height);
    horseBlack.push(c);
  }
  // continents tinted with green paper
  const c=document.createElement('canvas');c.width=contImg.width;c.height=contImg.height;
  const x=c.getContext('2d');x.drawImage(contImg,0,0);x.globalCompositeOperation='source-in';
  x.fillStyle='#55cf40';x.fillRect(0,0,c.width,c.height);
  x.globalCompositeOperation='source-atop';x.globalAlpha=0.22;
  x.drawImage(papers.green[0],0,0,contImg.width,contImg.height);
  contTinted=c;
}
// ---------- draw helpers ----------
function paperIdx(F){return Math.floor(F/2)%4;}
function drawHorse(x,F,cx,cy,sc,variant='white',glow=0){
  const j=((Math.floor(F)-9)%32+32)%32, m=META.frames[j], im=variant==='black'?horseBlack[j]:horse[j];
  const dx=m.dx*sc, dy=m.dy*sc, w=m.w*sc, h=m.h*sc;
  const ga0=x.globalAlpha;
  if(glow>0){
    x.save();x.globalCompositeOperation='lighter';x.filter=`blur(${Math.round(7+glow*13)}px)`;x.globalAlpha=0.8*ga0;
    x.drawImage(horse[j],cx+dx-w/2,cy+dy-h/2,w,h);
    if(glow>0.5){x.globalAlpha=0.5*ga0;x.drawImage(horse[j],cx+dx-w/2,cy+dy-h/2,w,h);}
    x.restore();
  }
  x.save();x.globalAlpha=ga0;
  if(sc>1.2)x.filter=`blur(${Math.min(1.8,(sc-1)*1.1).toFixed(2)}px)`;
  x.drawImage(im,cx+dx-w/2,cy+dy-h/2,w,h);
  x.restore();
}
// hand-wobble dashed circle
function dashCircle(x,F,cx,cy,r,lw,dashA,gapA,alpha=1,phase=0){
  if(alpha<=0)return;
  x.save();x.globalAlpha=alpha;x.strokeStyle='#f4f2ec';x.lineWidth=lw;x.lineCap='round';
  const rot=phase+F*0.0035;
  let a=rot;
  const step=dashA+gapA;
  const n=Math.ceil(2*Math.PI/step);
  for(let i=0;i<n;i++){
    const a0=a+i*step, a1=a0+dashA;
    const rr=r+ (wob(i*3.7+F*0.12)-0.5)*r*0.03;
    x.beginPath();x.arc(cx,cy,rr,a0,a1);x.stroke();
  }
  x.restore();
}
function dashLine(x,F,x0,y0,ang,len,lw,alpha=1){
  if(alpha<=0||len<=0)return;
  x.save();x.globalAlpha=alpha;x.strokeStyle='#f4f2ec';x.lineWidth=lw;x.lineCap='round';
  const dash=20,gap=14;let d=12;
  while(d<len){
    const d1=Math.min(d+dash,len);
    const j=(wob2(d*0.21+F*0.1)-0.5)*4;
    x.beginPath();
    x.moveTo(x0+Math.cos(ang)*d+Math.cos(ang+Math.PI/2)*j, y0+Math.sin(ang)*d+Math.sin(ang+Math.PI/2)*j);
    x.lineTo(x0+Math.cos(ang)*d1+Math.cos(ang+Math.PI/2)*j, y0+Math.sin(ang)*d1+Math.sin(ang+Math.PI/2)*j);
    x.stroke();d+=dash+gap;
  }
  x.restore();
}
function blackBG(F){ctx.drawImage(papers.black[paperIdx(F)],0,0);ctx.drawImage(sparkle[paperIdx(F)],0,0);}
function headGroup(x,F,offX,glowAmt){
  // head + mouth slit + horse inside (clipped to head when offset? source: horse stays fixed, head slides over)
  x.save();x.translate(offX,0);
  x.drawImage(headTinted[paperIdx(F)],0,0);
  x.fillStyle='#f4f2ec';x.fillRect(4,340,50,26); // mouth slit
  x.restore();
  drawHorse(x,F,375,429,1.0,'white',glowAmt||0);
}
// ---------- the loop timeline (F in [0,356)) ----------
const NODE={cx:353,cy:352,r:112};
const SPOKES=[-90,-35,35,115,180,-145].map(d=>d*Math.PI/180);
function renderLoop(F){
  const x=ctx;
  if(F<49){ // S1 hold + S2 head exits right (F36-49)
    blackBG(F);
    const e2=seg(F,34,49); const ex=e2*e2;
    headGroup(x,F,ex*800,0);
  }
  else if(F<84){ // S3 circle contracts then zoom past
    blackBG(F);
    const sc=lerp(1.0,1.8,E.io(seg(F,49,83)));
    const hx=lerp(375,370,seg(F,49,83)), hy=lerp(429,320,E.io(seg(F,52,70)));
    drawHorse(x,F,hx,hy,sc);
    // circle: flies in from top-right, locks around horse, then expands past frame
    const t1=E.o(seg(F,52,66)), t2=E.i(seg(F,68,83));
    const ccx=lerp(840,372,t1), ccy=lerp(-200,330,t1);
    const r=lerp(430,250,t1)+t2*440;
    dashCircle(x,F,ccx,ccy,r,15,0.16,0.11,seg(F,50,53));
  }
  else if(F<135){ // S4 far node + S5 network grows   (HARD CUT at 84)
    blackBG(F);
    const gt=E.o(seg(F,84,102));
    const nr=lerp(58,NODE.r,gt);
    const ncx=lerp(374,NODE.cx,gt), ncy=lerp(296,NODE.cy,gt);
    dashCircle(x,F,ncx,ncy,nr,lerp(5,7,gt),0.20,0.14,1,1.3);
    drawHorse(x,F,ncx,ncy+6,lerp(0.13,0.25,gt));
    // spokes + satellites
    SPOKES.forEach((a,i)=>{
      const len=lerp(0,92,E.o(seg(F,94,107)));
      dashLine(x,F,ncx+Math.cos(a)*(nr+8),ncy+Math.sin(a)*(nr+8),a,len,6);
      const st=seg(F,103+i*2,109+i*2);
      if(st>0){
        const sx=ncx+Math.cos(a)*(nr+160),sy=ncy+Math.sin(a)*(nr+160);
        dashCircle(x,F,sx,sy,68*E.o(st),5,0.30,0.22,st,i);
        if(st>0.5)drawHorse(x,F,sx,sy+2,0.14);
      }
    });
  }
  else if(F<148){ // S6 zoom into node
    blackBG(F);
    const z=lerp(1,5.4,E.io(seg(F,135,149)));
    x.save();x.translate(NODE.cx,NODE.cy);x.scale(z,z);x.translate(-NODE.cx,-NODE.cy);
    dashCircle(x,F,NODE.cx,NODE.cy,NODE.r,7/Math.sqrt(z),0.20,0.14,1,1.3);
    SPOKES.forEach((a,i)=>{
      dashLine(x,F,NODE.cx+Math.cos(a)*(NODE.r+8),NODE.cy+Math.sin(a)*(NODE.r+8),a,92,6/Math.sqrt(z));
      const sx=NODE.cx+Math.cos(a)*(NODE.r+160),sy=NODE.cy+Math.sin(a)*(NODE.r+160);
      dashCircle(x,F,sx,sy,68,5/Math.sqrt(z),0.30,0.22,1,i);
      drawHorse(x,F,sx,sy+2,0.14);
    });
    x.restore();
    // ground rises full-width as we enter the node's world
    const ga=seg(F,140,150);
    if(ga>0){
      const hy=lerp(700,480,E.o(ga));
      x.save();x.globalAlpha=0.55+0.45*ga;x.fillStyle='#12240f';
      x.fillRect(0,hy,W,H-hy);x.restore();
    }
    const hg=E.io(seg(F,136,149));
    drawHorse(x,F,lerp(NODE.cx,373,hg),lerp(NODE.cy+6,452,hg),lerp(0.25,1.35,hg));
  }
  else if(F<176){ // S7 landscape brightens
    const t=seg(F,148,168);
    // sky
    const sa=E.io(t);
    x.fillStyle=`rgb(${Math.round(lerp(10,SKY[0],sa))},${Math.round(lerp(14,SKY[1],sa))},${Math.round(lerp(42,SKY[2],sa))})`;
    x.fillRect(0,0,W,H);
    x.save();x.globalAlpha=sa;x.drawImage(papers.sky[paperIdx(F)],0,0);x.restore();
    // ground
    const hy=lerp(480,470,seg(F,148,156));
    x.save();x.beginPath();x.rect(0,hy,W,H-hy);x.clip();
    x.fillStyle=`rgb(${Math.round(lerp(12,GREEN[0],sa))},${Math.round(lerp(26,GREEN[1],sa))},${Math.round(lerp(14,GREEN[2],sa))})`;
    x.fillRect(0,hy,W,H-hy);
    x.globalAlpha=sa;x.drawImage(papers.green[paperIdx(F)],0,0);x.restore();
    // fading dash arcs (remnant of circle)
    dashCircle(x,F,NODE.cx,NODE.cy,520,18,0.10,0.07,(1-seg(F,148,160))*0.9,1.3);
    // sun
    const sunA=seg(F,149,152);
    if(sunA>0){
      const ci=F>=184?5:F>=176?4:F>=164?3:F>=156?2:F>=153?1:0;
      x.save();x.globalAlpha=sunA;x.fillStyle=SUNCOLORS[ci];
      x.beginPath();x.arc(72,46,17,0,7);x.fill();x.restore();
    }
    drawHorse(x,F,373,455,1.35);
  }
  else if(F<196){ // S8 climb to sky
    x.drawImage(papers.sky[paperIdx(F)],0,0);
    const hy=lerp(470,790,E.io(seg(F,176,183)));
    if(hy<H){
      x.save();x.beginPath();x.rect(0,hy,W,H-hy);x.clip();
      x.fillStyle=`rgb(${GREEN[0]},${GREEN[1]},${GREEN[2]})`;x.fillRect(0,hy,W,H-hy);
      x.drawImage(papers.green[paperIdx(F)],0,0);x.restore();
    }
    // sun drifts up & fades
    const sa=1-seg(F,186,193);
    if(sa>0){
      const ci=F>=184?5:4;
      x.save();x.globalAlpha=sa;x.fillStyle=SUNCOLORS[ci];
      x.beginPath();x.arc(72,lerp(46,-30,seg(F,188,196)),17,0,7);x.fill();x.restore();
    }
    const hx=lerp(373,-430,E.i(seg(F,188,193)));
    drawHorse(x,F,hx,lerp(455,505,seg(F,176,193)),lerp(1.35,1.55,seg(F,176,193)));
  }
  else if(F<216){ // S9 sky shrinks to disc
    blackBG(F);
    const r=lerp(900,281,E.o(seg(F,196,214)));
    x.save();x.beginPath();x.arc(362,360,r,0,7);x.clip();
    x.drawImage(papers.sky[paperIdx(F)],0,0);x.restore();
  }
  else if(F<244){ // S10 earth
    blackBG(F);
    const r=281+Math.sin(F*0.05)*2;
    x.save();x.beginPath();x.arc(362,360,r,0,7);x.clip();
    x.drawImage(papers.sky[paperIdx(F)],0,0);
    const ca=seg(F,216,224);
    x.globalAlpha=ca;
    const drift=-(F-238)*0.35;
    x.drawImage(contTinted,362-285+drift,360-283,570,566);
    x.restore();
  }
  else if(F<272){ // S11 black horse crosses in front of earth
    blackBG(F);
    const gp=E.io(seg(F,258,272));
    const gcx=362+gp*260, ga=1-seg(F,268,276);
    const r=281;
    if(ga>0){
      x.save();x.globalAlpha=ga;
      x.save();x.beginPath();x.arc(gcx,360,r,0,7);x.clip();
      const drift=-(F-238)*0.35;
      x.drawImage(papers.sky[paperIdx(F)],gcx-362,0);
      x.drawImage(contTinted,gcx-285+drift,360-283,570,566);
      x.restore();x.restore();
    }
    const hx=lerp(1000,80,seg(F,244,268)), hy=385, sc=2.5;
    // black silhouette over the globe (invisible on black space)
    if(ga>0){
      const wa0=seg(F,266,269);
      x.save();x.beginPath();x.arc(gcx,360,r,0,7);x.clip();
      x.globalAlpha=ga*(1-wa0); drawHorse(x,F,hx,hy,sc,'black');
      x.restore();
    }
    // flips white once clear of the globe (horse left of globe edge)
    const wa=seg(F,266,269);
    if(wa>0){x.save();x.globalAlpha=wa;drawHorse(x,F,hx,hy,lerp(sc,1.6,seg(F,266,278)),'white',0.45);x.restore();}
  }
  else if(F<312){ // S12 glow horse + S13 head slides back (302-312)
    blackBG(F);
    const burst=Math.max(0,Math.sin(Math.PI*seg(F,272,284)));
    // radial streaks at entry
    if(burst>0.02){
      const r=mb32(5);x.save();x.globalCompositeOperation='lighter';
      for(let i=0;i<14;i++){
        const a=r()*Math.PI*2,l0=120+r()*80,l1=l0+60+r()*180;
        x.globalAlpha=burst*(0.12+r()*0.25);
        x.strokeStyle='#fff';x.lineWidth=2+r()*3;
        x.beginPath();x.moveTo(385+Math.cos(a)*l0,390+Math.sin(a)*l0);
        x.lineTo(385+Math.cos(a)*l1,390+Math.sin(a)*l1);x.stroke();
      }
      x.restore();
    }
    const glow=lerp(0.9,0.3,seg(F,272,298));
    const hx=lerp(408,375,seg(F,272,306)), hy=lerp(368,429,E.io(seg(F,272,306)));
    const sc=lerp(1.5,1.0,E.io(seg(F,274,306)));
    const headIn=E.o(seg(F,296,310));
    if(headIn>0)
      {x.save();x.translate((1-headIn)*780,0);x.drawImage(headTinted[paperIdx(F)],0,0);
       x.fillStyle='#f4f2ec';x.fillRect(4,340,50,26);x.restore();}
    drawHorse(x,F,hx,hy,sc,'white',glow*(1-seg(F,298,310)));
  }
  else{ // S14 hold
    blackBG(F);
    const glow=Math.max(0,0.35*(1-seg(F,312,320)));
    headGroup(x,F,0,glow);
  }
  // global grain
  x.save();x.globalAlpha=0.05;x.globalCompositeOperation='overlay';
  x.drawImage(sparkle[(paperIdx(F)+2)%4],0,0);x.restore();
}
function renderFrame(t){
  const Fg=Math.floor(t*FPS+0.0001);
  const F=((Fg%LOOP)+LOOP)%LOOP;
  renderLoop(F);
}
window.renderFrame=renderFrame;
window.READY=false;
loadAll().then(()=>{prep();window.READY=true;
  const q=new URLSearchParams(location.search);
  renderFrame(parseFloat(q.get('t')||'0'));
});
document.addEventListener('keydown',e=>{
  const q=new URLSearchParams(location.search);
  let t=parseFloat(q.get('t')||'0');
  if(e.key==='ArrowRight')t+=1/24; if(e.key==='ArrowLeft')t-=1/24;
  if(e.key==='ArrowUp')t+=0.5; if(e.key==='ArrowDown')t-=0.5;
  q.set('t',Math.max(0,t).toFixed(3)); history.replaceState(null,'','?'+q); renderFrame(parseFloat(q.get('t')));
});
</script>
</body>
</html>
