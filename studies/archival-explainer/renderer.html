<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Archival Explainer — frame renderer</title>
<style>
  @font-face { font-family:'EBG'; src:url('assets/ebgaramond-400.ttf'); font-weight:400; }
  @font-face { font-family:'EBG'; src:url('assets/ebgaramond-600.ttf'); font-weight:600; }
  @font-face { font-family:'EBG'; src:url('assets/ebgaramond-700.ttf'); font-weight:700; }
  @font-face { font-family:'EBG'; src:url('assets/ebgaramond-italic.ttf'); font-weight:500; font-style:italic; }
  html,body{margin:0;background:#222}
  canvas{display:block;width:405px;height:720px;margin:0 auto}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
const W=1080, H=1920, FPS=30, DUR=61.0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

// ---------- utils ----------
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const E={
  outCubic:t=>1-Math.pow(1-t,3),
  outQuint:t=>1-Math.pow(1-t,5),
  inOutQuad:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  outBack:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

// palette
const YELLOW='#f2c230', RED='#b8352b', INK='#111111', PAPER='#efe9da';

// ---------- assets ----------
const IMGS={}, SRC={
  certObv:'assets/cert_obverse.jpg',
  certRev:'assets/cert_reverse.jpg',
  certRevNo:'assets/cert_reverse_nomotto.jpg',
  capitol:'assets/United_States_Capitol_west_front_edit2.jpg',
  crowd:'assets/crowd.jpg',
  dollarRev:'assets/dollar_reverse.jpg',
};
function loadAll(){
  return Promise.all(Object.entries(SRC).map(([k,s])=>new Promise((res,rej)=>{
    const im=new Image(); im.onload=()=>{IMGS[k]=im;res();}; im.onerror=rej; im.src=s;
  })).concat([document.fonts.load('400 40px EBG'),document.fonts.load('600 40px EBG'),
              document.fonts.load('700 40px EBG'),document.fonts.load('italic 500 40px EBG')]));
}

// grayscale + graded copies (lifted blacks, desaturated)
const GRAY={};
function makeGray(key){
  const im=IMGS[key], c=document.createElement('canvas');
  c.width=im.width; c.height=im.height;
  const x=c.getContext('2d');
  x.filter='grayscale(1) contrast(0.9) brightness(1.04)';
  x.drawImage(im,0,0);
  x.filter='none';
  x.globalCompositeOperation='lighten'; x.fillStyle='#161616'; x.fillRect(0,0,c.width,c.height);
  GRAY[key]=c;
}

// pre-rendered grain tiles (deterministic)
const grains=[];
function makeGrain(){
  for(let i=0;i<4;i++){
    const c=document.createElement('canvas'); c.width=540; c.height=960;
    const x=c.getContext('2d'), id=x.createImageData(540,960), r=mulberry32(1234+i*77);
    for(let p=0;p<id.data.length;p+=4){
      const v=128+(r()-0.5)*110;
      id.data[p]=id.data[p+1]=id.data[p+2]=v; id.data[p+3]=255;
    }
    x.putImageData(id,0,0); grains.push(c);
  }
}
let vigCan=null;
function makeVig(){
  vigCan=document.createElement('canvas'); vigCan.width=W; vigCan.height=H;
  const x=vigCan.getContext('2d');
  const g=x.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.5)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
}

// ---------- draw helpers ----------
// cover-draw an image with center (cx,cy in 0..1 of img) and zoom (1 = cover)
function cover(x,img,cx,cy,zoom,alpha=1,blur=0){
  const iw=img.width, ih=img.height;
  const s=Math.max(W/iw,H/ih)*zoom;
  const dw=iw*s, dh=ih*s;
  const dx=W/2-cx*dw, dy=H/2-cy*dh;
  x.save(); if(blur>0)x.filter=`blur(${blur}px)`; x.globalAlpha=alpha;
  x.drawImage(img,dx,dy,dw,dh); x.restore();
}
// Ken Burns between two {cx,cy,z}
function kb(x,img,t01,a,b,alpha=1,blur=0){
  const e=E.inOutQuad(t01);
  cover(x,img,lerp(a.cx,b.cx,e),lerp(a.cy,b.cy,e),lerp(a.z,b.z,e),alpha,blur);
}
function grainPass(t,amount=0.11){
  const f=Math.floor(t*FPS), tile=grains[f%4], r=mulberry32(f*911+3);
  ctx.save(); ctx.globalAlpha=amount; ctx.globalCompositeOperation='overlay';
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(tile,-Math.floor(r()*60),-Math.floor(r()*60),W+120,H+120);
  ctx.imageSmoothingEnabled=true; ctx.restore();
}
function vigPass(a=1){ ctx.save(); ctx.globalAlpha=a; ctx.drawImage(vigCan,0,0); ctx.restore(); }
function hazePassMain(a){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#e8e4d8'; ctx.fillRect(0,0,W,H); ctx.restore(); }
function hazeOn(x,a){ x.save(); x.globalAlpha=a; x.fillStyle='#e8e4d8'; x.fillRect(0,0,W,H); x.restore(); }

// ---------- captions ----------
// words: [{w, t0, mode}] mode: 'plain'|'yellow'|'red'; color scheme via dark bg flag
// Each word blurs/fades in at its t0 (0.25s). Whole card fades out at tOut.
function captionCard(x,t,words,opts={}){
  const {dark=true, y=H*0.60, size=46, tOut=1e9, gap=16}=opts;
  const tIn=opts.tIn??-1e9;
  if(t<tIn)return;
  const aOut=1-seg(t,tOut,tOut+0.25);
  if(aOut<=0)return;
  x.save(); x.globalAlpha=aOut;
  x.font=`400 ${size}px EBG`;
  // layout: measure all words (box words get padding)
  const pad=Math.round(size*0.28);
  const ms=words.map(o=>{
    x.font=(o.mode&&o.mode!=='plain')?`600 ${size}px EBG`:`400 ${size}px EBG`;
    const w=x.measureText(o.w).width;
    return o.mode&&o.mode!=='plain'? w+pad*2 : w;
  });
  const total=ms.reduce((a,b)=>a+b,0)+gap*(words.length-1);
  // wrap if too wide: split rows
  const rows=[]; let row=[],rw=0;
  words.forEach((o,i)=>{
    if(rw+ms[i]>W*0.86 && row.length){rows.push([row,rw]);row=[];rw=0;}
    row.push([o,ms[i]]); rw+=ms[i]+gap;
  });
  rows.push([row,rw]);
  const lh=size*1.65;
  rows.forEach(([rwords,rwidth],ri)=>{
    let xx=W/2-(rwidth-gap)/2;
    const yy=y+ri*lh - (rows.length-1)*lh/2;
    rwords.forEach(([o,mw])=>{
      const a=seg(t,o.t0,o.t0+0.28);
      if(a>0){
        x.save(); x.globalAlpha=aOut*E.outCubic(a);
        const bl=(1-a)*6;
        if(bl>0.3)x.filter=`blur(${bl}px)`;
        x.textAlign='left';
        if(o.mode==='yellow'||o.mode==='red'){
          x.fillStyle=o.mode==='yellow'?YELLOW:RED;
          const bh=size*1.5;
          x.fillRect(xx,yy-bh*0.72,mw,bh);
          x.fillStyle=o.mode==='yellow'?INK:'#f5efe2';
          x.font=`600 ${size}px EBG`;
          x.fillText(o.w,xx+pad,yy+size*0.30);
        }else{
          x.fillStyle=dark?'#efe9dc':'#161412';
          x.font=`400 ${size}px EBG`;
          if(dark){x.shadowColor='rgba(0,0,0,0.8)';x.shadowBlur=16;}
          else{x.shadowColor='rgba(235,228,212,0.8)';x.shadowBlur=10;}
          x.fillText(o.w,xx,yy+size*0.30);
        }
        x.restore();
      }
      xx+=mw+gap;
    });
  });
  x.restore();
}
// emphasis card: big yellow word + small stacked connectives
// parts: [{w,t0,big?,italic?,dy}]
function emphasisCard(x,t,parts,opts={}){
  const {size=46,bigSize=190}=opts;
  const push=1+0.035*seg(t,opts.pt0??0,(opts.pt0??0)+6);
  parts.forEach(p=>{
    const a=seg(t,p.t0,p.t0+0.33);
    if(a<=0)return;
    x.save(); x.globalAlpha=E.outCubic(a);
    x.translate(W/2,H/2); x.scale(push,push); x.translate(-W/2,-H/2);
    const bl=(1-a)*8; if(bl>0.3)x.filter=`blur(${bl}px)`;
    if(p.big){
      x.font=`${p.italic?'italic 500':'700'} ${bigSize}px EBG`;
      x.fillStyle=YELLOW;
    }else{
      x.font=`400 ${size}px EBG`;
      x.fillStyle='#efe9dc';
    }
    x.textAlign='center';
    x.fillText(p.w, W/2, H/2+p.dy);
    x.restore();
  });
}

// small corner label for non-archival scenes
function illoTag(x,a=0.4){
  x.save(); x.globalAlpha=a; x.font='400 26px EBG'; x.fillStyle='#bdb7a9';
  x.textAlign='right'; x.fillText('illustration', W-36, 64); x.restore();
}

// ---------- procedural backdrops ----------
function gridPaper(x){
  x.fillStyle='#e9e2d0'; x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(120,110,90,0.18)'; x.lineWidth=2;
  for(let gx=0;gx<=W;gx+=72){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke();}
  for(let gy=0;gy<=H;gy+=72){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke();}
  const r=mulberry32(42);
  for(let i=0;i<5;i++){
    const sx=r()*W,sy=r()*H,sr=120+r()*260;
    const g=x.createRadialGradient(sx,sy,0,sx,sy,sr);
    g.addColorStop(0,'rgba(140,120,80,0.10)');g.addColorStop(1,'rgba(140,120,80,0)');
    x.fillStyle=g;x.fillRect(sx-sr,sy-sr,sr*2,sr*2);
  }
}
function fakeLines(x,x0,y0,w,n,lh,seed,color='rgba(40,38,34,0.55)'){
  const r=mulberry32(seed);
  x.fillStyle=color;
  for(let i=0;i<n;i++){
    const lw=w*(0.75+r()*0.25);
    x.fillRect(x0,y0+i*lh,(i===n-1? w*0.5 : lw),lh*0.42);
  }
}
function newsprint(x,alpha=1){
  x.save(); x.globalAlpha=alpha;
  x.fillStyle='#ded7c4'; x.fillRect(0,0,W,H);
  x.fillStyle='#262420'; x.textAlign='center'; x.font='700 110px EBG';
  x.fillText('The Daily Record',W/2,190);
  x.strokeStyle='#262420'; x.lineWidth=3;
  x.beginPath();x.moveTo(90,230);x.lineTo(W-90,230);x.stroke();
  x.beginPath();x.moveTo(90,244);x.lineTo(W-90,244);x.stroke();
  const cols=3,cw=(W-180-40*(cols-1))/cols;
  for(let ci=0;ci<cols;ci++){
    fakeLines(x,90+ci*(cw+40),320,cw,42,30,ci*7+1);
  }
  x.restore();
}
function manuscript(x,alpha=1){
  x.save(); x.globalAlpha=alpha;
  x.fillStyle='#e4d9bd'; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(60,45,25,0.75)';
  x.font='italic 500 44px EBG'; x.textAlign='left';
  const latin=['Dominus illuminatio mea','et salus mea quem timebo','Dominus protector vitae','a quo trepidabo si consistant','adversum me castra non','timebit cor meum si exsurgat','in hoc ego sperabo unam','petii a Domino hanc requiram'];
  x.font='700 170px EBG'; x.fillStyle='rgba(70,55,30,0.8)'; x.fillText('D',120,420);
  x.font='italic 500 44px EBG'; x.fillStyle='rgba(60,45,25,0.72)';
  for(let i=0;i<22;i++){ x.fillText(latin[i%latin.length], i<4?300:120, 330+i*74); }
  x.restore();
}
function cathedral(x,alpha=1,glow=0.5){
  // dark gothic arches silhouette with window light
  x.save(); x.globalAlpha=alpha;
  x.fillStyle='#0c0b0a'; x.fillRect(0,0,W,H);
  // central lancet window glow
  const wx=W/2, wy=H*0.42, ww=330, wh=900;
  const g=x.createRadialGradient(wx,wy,40,wx,wy,760);
  g.addColorStop(0,`rgba(235,225,200,${0.85*glow})`);
  g.addColorStop(0.45,`rgba(200,190,165,${0.3*glow})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  // window shape
  x.fillStyle=`rgba(240,232,210,${0.9*glow})`;
  x.beginPath();
  x.moveTo(wx-ww/2,wy+wh/2); x.lineTo(wx-ww/2,wy-wh*0.15);
  x.quadraticCurveTo(wx-ww/2,wy-wh/2,wx,wy-wh/2-60);
  x.quadraticCurveTo(wx+ww/2,wy-wh/2,wx+ww/2,wy-wh*0.15);
  x.lineTo(wx+ww/2,wy+wh/2); x.closePath(); x.fill();
  // mullions
  x.strokeStyle='#0c0b0a'; x.lineWidth=16;
  x.beginPath();x.moveTo(wx,wy-wh/2-40);x.lineTo(wx,wy+wh/2);x.stroke();
  x.beginPath();x.moveTo(wx-ww/2,wy);x.lineTo(wx+ww/2,wy);x.stroke();
  // flanking arches (dark outlines)
  x.strokeStyle='rgba(180,170,150,0.20)'; x.lineWidth=10;
  [[-1,0.72],[1,0.72]].forEach(([s,sc])=>{
    const ax=wx+s*385, aw=250*sc, ah=640*sc, ay=H*0.52;
    x.beginPath();
    x.moveTo(ax-aw/2,ay+ah/2); x.lineTo(ax-aw/2,ay-ah*0.1);
    x.quadraticCurveTo(ax-aw/2,ay-ah/2,ax,ay-ah/2-40*sc);
    x.quadraticCurveTo(ax+aw/2,ay-ah/2,ax+aw/2,ay-ah*0.1);
    x.lineTo(ax+aw/2,ay+ah/2); x.stroke();
  });
  x.restore();
}
function congregation(x,alpha=1){
  // rows of silhouette heads in perspective, lit from window
  x.save(); x.globalAlpha=alpha;
  const r=mulberry32(99);
  for(let row=0;row<6;row++){
    const yy=H*0.78+row*74, sc=1+row*0.22, n=9+row*2;
    x.fillStyle=`rgba(8,8,8,${0.95})`;
    for(let i=0;i<n;i++){
      const xx=(W*(i+0.5))/n + (r()-0.5)*36;
      const hw=34*sc, hh=44*sc;
      x.beginPath(); x.ellipse(xx,yy,hw*0.62,hh*0.62,0,0,Math.PI*2); x.fill();
      x.beginPath(); x.ellipse(xx,yy+hh*1.25,hw*1.25,hh*0.95,0,Math.PI,Math.PI*2); x.fill();
    }
  }
  x.restore();
}
function godRays(x,t,alpha){
  x.save(); x.globalCompositeOperation='screen'; x.globalAlpha=alpha;
  const cx=W/2, cy=H*0.1;
  for(let i=0;i<5;i++){
    const ang=-0.55+i*0.26 + Math.sin(t*0.4+i)*0.015;
    x.save(); x.translate(cx,cy); x.rotate(ang);
    const g=x.createLinearGradient(0,0,0,H*1.3);
    g.addColorStop(0,'rgba(235,225,195,0.22)'); g.addColorStop(1,'rgba(235,225,195,0)');
    x.fillStyle=g; x.fillRect(-55,0,110,H*1.4); x.restore();
  }
  x.restore();
}
function sovietScene(x,t,alpha=1){
  x.save(); x.globalAlpha=alpha;
  x.fillStyle='#0e0b0b'; x.fillRect(0,0,W,H);
  // red glow sky
  const g=x.createRadialGradient(W/2,H*0.30,60,W/2,H*0.30,900);
  g.addColorStop(0,'rgba(150,25,20,0.55)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  // waving flags (bezier banners)
  const r=mulberry32(5);
  for(let i=0;i<4;i++){
    const fx=140+i*240+(i%2)*40, fy=H*0.26+((i*97)%120), fw=300, fh=210;
    const ph=Math.sin(t*1.2+i*1.7)*18;
    x.fillStyle=`rgba(${108+i*14},${20+i*2},${18},0.95)`;
    x.beginPath();
    x.moveTo(fx,fy);
    x.bezierCurveTo(fx+fw*0.35,fy-26+ph, fx+fw*0.7,fy+22-ph, fx+fw,fy+6);
    x.lineTo(fx+fw,fy+fh);
    x.bezierCurveTo(fx+fw*0.65,fy+fh+22-ph, fx+fw*0.3,fy+fh-20+ph, fx,fy+fh+8);
    x.closePath(); x.fill();
    // pole
    x.fillStyle='rgba(30,26,24,0.9)'; x.fillRect(fx-8,fy-60,10,fh+420);
  }
  // marching silhouettes
  x.fillStyle='rgba(6,5,5,0.96)';
  for(let i=0;i<14;i++){
    const mx=(W*(i+0.5))/14, my=H*0.80, sw=58, sh=200;
    x.beginPath(); x.ellipse(mx,my-sh*0.78,sw*0.3,sw*0.33,0,0,Math.PI*2); x.fill();
    x.fillRect(mx-sw*0.4,my-sh*0.62,sw*0.8,sh*0.62);
  }
  x.fillStyle='rgba(6,5,5,1)'; x.fillRect(0,H*0.80,W,H*0.2);
  x.restore();
}
function clippingPaper(x){
  // torn-edge newspaper clipping, drawn in its own local space 840x980
  const cw=840, ch=980;
  x.fillStyle='#e7e0cc';
  // torn edges
  const r=mulberry32(31);
  x.beginPath(); x.moveTo(0,14);
  for(let xx=0;xx<=cw;xx+=42) x.lineTo(xx, 8+r()*14);
  x.lineTo(cw, ch-10);
  for(let xx=cw;xx>=0;xx-=42) x.lineTo(xx, ch-8-r()*14);
  x.closePath(); x.fill();
  x.fillStyle='#24221e'; x.textAlign='left';
  x.font='700 64px EBG';
  x.fillText('CONGRESS ADDS', 60, 130);
  x.fillText('‘UNDER GOD’ TO PLEDGE', 60, 206);
  x.strokeStyle='#24221e'; x.lineWidth=2;
  x.beginPath();x.moveTo(60,238);x.lineTo(cw-60,238);x.stroke();
  x.font='600 34px EBG';
  x.fillText('WASHINGTON, June 14, 1954 —', 60, 300);
  x.font='400 34px EBG'; x.fillStyle='rgba(36,34,30,0.9)';
  const body=['The President today signed a bill','directing that the Pledge of','Allegiance shall henceforth read:','','“one nation under God,','indivisible, with liberty','and justice for all.”'];
  body.forEach((l,i)=>x.fillText(l,60,356+i*48));
  fakeLines(x,60,730,cw-120,5,34,8,'rgba(36,34,30,0.45)');
}
function lawCard(x){
  const cw=860, ch=700;
  x.fillStyle='#ece5d2'; x.fillRect(0,0,cw,ch);
  x.strokeStyle='rgba(40,36,30,0.8)'; x.lineWidth=5; x.strokeRect(26,26,cw-52,ch-52);
  x.fillStyle='#24221e'; x.textAlign='center';
  x.font='600 40px EBG'; x.fillText('PUBLIC LAW 84–851', cw/2, 130);
  x.font='400 34px EBG'; x.fillText('July 30, 1956', cw/2, 186);
  x.font='400 36px EBG'; x.fillText('the national motto of the', cw/2, 300);
  x.fillText('United States shall be', cw/2, 352);
  x.font='700 72px EBG'; x.fillText('IN GOD WE TRUST', cw/2, 480);
  x.strokeStyle='rgba(40,36,30,0.6)'; x.lineWidth=2;
  x.beginPath();x.moveTo(140,540);x.lineTo(cw-140,540);x.stroke();
  fakeLines(x,120,580,cw-240,2,36,12,'rgba(36,34,30,0.4)');
}

// offscreen helper
function off(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d')); return c; }
let CLIP=null, LAW=null;
function makeDocs(){ CLIP=off(840,980,clippingPaper); LAW=off(860,700,lawCard); }

// collage print insert (photo w/ white border + shadow), lands tilted with overshoot
function insertPrint(x,img,t01,cx,cy,w,rotEnd,opts={}){
  if(t01<=0)return;
  const e=E.outBack(clamp(t01,0,1));
  const scale=lerp(1.5,1,e), rot=lerp(rotEnd+0.3,rotEnd,e), a=seg(t01,0,0.25);
  const h=w*img.height/img.width;
  x.save(); x.globalAlpha=a; x.translate(cx,cy); x.rotate(rot); x.scale(scale,scale);
  x.shadowColor='rgba(0,0,0,0.55)'; x.shadowBlur=40; x.shadowOffsetY=22;
  const b=opts.border??26;
  x.fillStyle='#f0ebdd'; x.fillRect(-w/2-b,-h/2-b,w+2*b,h+2*b+(opts.bottom??0));
  x.shadowColor='transparent';
  x.drawImage(img,-w/2,-h/2,w,h);
  x.restore();
}
// circle-masked inset
function circleInset(x,img,t01,cx,cy,rad,imcx,imcy,imz){
  if(t01<=0)return;
  const e=E.outBack(clamp(t01,0,1)), r=rad*lerp(0.6,1,e), a=seg(t01,0,0.25);
  x.save(); x.globalAlpha=a;
  x.shadowColor='rgba(0,0,0,0.5)'; x.shadowBlur=36; x.shadowOffsetY=16;
  x.fillStyle='#f0ebdd'; x.beginPath(); x.arc(cx,cy,r+14,0,Math.PI*2); x.fill();
  x.shadowColor='transparent';
  x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.clip();

const WIPE_D=0.32, DISS_D=0.45;

let sceneBuf=null, sceneBuf2=null;
function renderScene(s,t,target){
  const x=target.getContext('2d');
  x.save(); x.clearRect(0,0,W,H); s.draw(x,t); x.restore();
}
function renderFrame(t){
  t=clamp(t,0,DUR-0.001);
  if(!sceneBuf){sceneBuf=document.createElement('canvas');sceneBuf.width=W;sceneBuf.height=H;
                sceneBuf2=document.createElement('canvas');sceneBuf2.width=W;sceneBuf2.height=H;}
  // find current scene
  let idx=SCENES.findIndex(s=>t>=s.t0&&t<s.t1); if(idx<0)idx=SCENES.length-1;
  const s=SCENES[idx], prev=SCENES[idx-1];
  ctx.save(); ctx.clearRect(0,0,W,H);
  const into=t-s.t0;
  if(prev && s.enter==='wipe' && into<WIPE_D){
    const e=E.inOutQuad(into/WIPE_D);
    renderScene(prev,t,sceneBuf); renderScene(s,t,sceneBuf2);
    ctx.drawImage(sceneBuf,0,0);
    // flat slab slides across (with leading edge shadow)
    const xw=lerp(-W,0,e);
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=60; ctx.shadowOffsetX=30;
    ctx.beginPath(); ctx.rect(xw,0,W,H); ctx.clip();
    ctx.shadowColor='transparent';
    ctx.drawImage(sceneBuf2,xw,0);
    ctx.restore();
  }else if(prev && s.enter==='dissolve' && into<DISS_D){
    const e=into/DISS_D;
    renderScene(prev,t,sceneBuf); renderScene(s,t,sceneBuf2);
    const bl=Math.sin(e*Math.PI)*10;
    ctx.save(); ctx.filter=`blur(${bl}px)`; ctx.globalAlpha=1; ctx.drawImage(sceneBuf,0,0); ctx.restore();
    ctx.save(); ctx.filter=`blur(${bl}px)`; ctx.globalAlpha=e; ctx.drawImage(sceneBuf2,0,0); ctx.restore();
  }else{
    s.draw(ctx,t);
  }
  // global grade
  const fogA = s.mode==='fog'?0.10 : s.mode==='paper'?0.05 : 0;
  if(fogA>0)hazePassMain(fogA);
  vigPass(s.mode==='fog'||s.mode==='paper'?0.55:0.9);
  grainPass(t, s.mode==='fog'||s.mode==='paper'?0.09:0.13);
  ctx.restore();
  return true;
}
window.renderFrame=renderFrame;
window.READY=false;
loadAll().then(()=>{
  makeGrain(); makeVig(); makeDocs();
  ['crowd','capitol','certObv'].forEach(makeGray);
  window.READY=true;
  const q=new URLSearchParams(location.search);
  renderFrame(parseFloat(q.get('t')||'0'));
});
// simple scrub for manual preview
document.addEventListener('keydown',e=>{
  const q=new URLSearchParams(location.search);
  let t=parseFloat(q.get('t')||'0');
  if(e.key==='ArrowRight')t+=0.5; if(e.key==='ArrowLeft')t-=0.5;
  q.set('t',t.toFixed(2)); history.replaceState(null,'','?'+q); renderFrame(t);
});
</script>
